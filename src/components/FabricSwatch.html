{{if and (eq .fabric_name "Ultrasuede ST") (eq .color "white")}}<span class="fabric-swatch" style="background-color: var(--color-ultrasuede-st-white)"></span>
{{else if and (eq .fabric_name "Ultrasuede ST") (eq .color "zodiac")}}<span class="fabric-swatch" style="background-color: var(--color-ultrasuede-st-zodiac)"></span>
{{else if and (eq .fabric_name "Ultrasuede ST") (eq .color "lemon")}}<span class="fabric-swatch" style="background-color: var(--color-ultrasuede-st-lemon)"></span>
{{end}}
